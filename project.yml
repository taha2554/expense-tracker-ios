# Xcode project definition for XcodeGen (https://github.com/yonaskolb/XcodeGen).
# Run `xcodegen` to create ExpenseTracker.xcodeproj – the .xcodeproj itself is not committed.
name: ExpenseTracker
options:
  bundleIdPrefix: dev.taha
  deploymentTarget:
    iOS: "17.0"
packages:
  ExpenseCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ExpenseTracker:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: ExpenseCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.taha.ExpenseTracker
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Expenses
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
